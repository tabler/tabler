name: Install Playwright Chromium
description: Restore the browser download from the cache and install Chromium only when the cache misses

runs:
  using: composite
  steps:
    # The cache key follows the installed version, so a dependency bump pulls a
    # fresh browser instead of reusing the one the old Playwright shipped with.
    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore the browser download
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

    # On a cache hit nothing else runs: the libraries Chromium links against are
    # part of the runner image, and `install-deps` would only add fonts and
    # minor upgrades through apt, which takes seconds or ten minutes depending
    # on the mirror.
    - name: Install Chromium and its system packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
