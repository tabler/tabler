name: Bug report
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      ## Thank you for making a bug report!
      Thanks for taking the time to fill out this bug report! Please fill this form out completely —
      incomplete reports are hard to replicate and may be closed.
- type: input
  id: version
  attributes:
    label: Tabler version
    description: "Which version of Tabler are you using?"
    placeholder: "e.g. 1.4.0"
  validations:
    required: true
- type: input
  id: browser
  attributes:
    label: Browser
    description: "What browser and version did this bug occur on?"
    placeholder: "e.g. Chrome ver.22, Safari ver.10"
  validations:
    required: true
- type: input
  id: os
  attributes:
    label: OS
    description: "What is the operating system of your device?"
    placeholder: "e.g. Windows 10, iOS 14, Ubuntu 23.04"
  validations:
    required: true
- type: input
  id: screen_size
  attributes:
    label: Screen size
    description: "What is the screen size of your device?"
    placeholder: "e.g. 800x600, 1920x1080"
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Describe the bug
    description: "A clear and concise description of what the bug is."
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: How to reproduce
    description: "How do you trigger this bug? Please walk us through it step by step."
    value: |
      1. Go to '...'
      2. Click on '...'
      3. Scroll down to '...'
      4. See error
      ...
  validations:
    required: true
- type: textarea
  id: screenshots
  attributes:
    label: Screenshots
    description: "If applicable, add screenshots here to help explain this problem. This helps us understand what's happening better."
  validations:
    required: false
- type: input
  id: jsfiddle
  attributes:
    label: Live example
    description: "Please add a link to a live example replicating the bug (for example a JSFiddle or CodeSandbox — you can start from our [starter template](https://codesandbox.io/api/v1/sandboxes/define?parameters=N4IgZglgNgpgziAXKCA7AJjAHgOgBYAuAtlEqAMYD2qBMNSIAPAITqXkECeADjAASESAPgA6qRoKh8oAQ1QBzALwiQdFaNR8-EmDPQatWxkRgEZfcnhkAnOKeUgArgTABaABwq-AegOHjpuaoMiYOAG4QMADu3JTWBF5UNHQEDlEQ6AR4ipgR5DCu6Zl4ADR8aBAEEDJQrnDkNTCKAIxevmKG2lUEsEIAKjIARrDWfJhElIze3b0d_lBoANZ81jBQDnBcsHB4MKZeeKtgDoQE3HCI3t7k6Kg4AFZwmAth1jiopt6o3ETeAAJmYYwazXOIwP6yWibbzoCDQ8hwODTIYjHBENA4BFwNp-Ka7PS4waUdCcPxGWFhCyyREObgyeQwdRzTqMClUmQ0lR0hmFawybi8axMzSdfxs8jUuC0-kFIkk4Wi0WsiCUiUcqUqJJmNDA1xYKAKxVK8WShwNazoQ1G40q9mckDm9CuOWcK3WpV4ZpCAASayglDKAyB1mYeK9zPdLO4do1IFoWAIdRgSXQNldICEAFFYQQ-Fk4Xw4HJ0ESsHnKHnrJw-JRnHwgyMLJQiLEPjQ4DgptwyZH_INnARqDGHIMCJpR6hXNxrBAiGn1AAFGdzqt8fsEQfibzrzc93vaHdDtX2ifqAAiMDAMkcUFzh639737qmFKfipfKrf_hhn4jLJ_YRPh-gERsBPaMPUM7cLmcDWOQJwbuclzXLcDxPGsKpvB8BBfD8_yAiMoKrBCMhQjhsLQo8yLBmiGKPOoUyQRA0G4tuxKkmIeLEFAQggAAvgJQA)). Without it, most bug reports cannot be solved and will be closed."
  validations:
    required: false
