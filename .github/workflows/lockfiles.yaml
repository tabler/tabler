name: Changed lock files
on:
  pull_request_target: 
    types: [opened, reopened]

permissions:
  pull-requests: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    name: Verify lock file integrity
    steps:
      - name: Clone Tabler
        uses: actions/checkout@v7
      - name: Prevent lock file change
        uses: xalvarez/prevent-file-change-action@dbc67c205c9ed02aa39c497b422c24f364c3e8dd # v3.0.1
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          pattern: Gemfile.lock|pnpm-lock.json|pnpm-lock.yaml
          trustedAuthors: codecalm, BG-Software-BG, dependabot
