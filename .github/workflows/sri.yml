name: SRI

on:
  pull_request: null
  push:
    branches:
      - dev
      - main
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  sri:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # Compares shared/data/sri.json with the files the CDN serves for the version in
      # core/package.json. Fix a failure with `pnpm run generate-sri`. Kept out of `pnpm run lint`
      # because it needs network access. Hashes for an older version only warn, except on `main`:
      # docs.tabler.io is built from it, so the hashes have to be refreshed before the merge.
      - name: Check SRI hashes
        run: pnpm run check:sri ${{ github.ref == 'refs/heads/main' && '--strict' || '' }}
