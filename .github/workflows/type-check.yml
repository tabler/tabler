name: Type Check

on:
  pull_request: null
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Run type-check
        run: pnpm run type-check

      - name: Type-check the build scripts
        run: pnpm run type-check:build

