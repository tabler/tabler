name: Release

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create release
      issues: write # to post issue comments
      pull-requests: write # to create pull request
      id-token: write # for npm trusted publishing (OIDC)
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Update npm # trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Build
        run: pnpm run build

      - name: Create release Pull Request or publish to NPM
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run publish
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changesets/action` fills the version pull request with one section per
      # package (`## @tabler/core@1.5.1`, …), so a changeset that touches several
      # packages shows up several times. Replace that body with the same notes the
      # GitHub release gets: the intro from `.github/release-notes/<version>.md`
      # and the changes grouped as core / demo / docs, each listed once. The
      # action rewrites the body on every push to dev, so this runs right after it.
      - name: Write the release notes into the version pull request
        if: steps.changesets.outputs.pr-number != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          git fetch --depth=1 origin changeset-release/dev
          git checkout --force --detach origin/changeset-release/dev
          version=$(node -p "require('./core/package.json').version")
          {
            echo "Merging this pull request publishes \`@tabler/core@${version}\` to npm and creates the GitHub release. It is regenerated on every push to \`dev\`."
            echo
            pnpm run --silent release-notes
          } > "${RUNNER_TEMP}/pr-body.md"
          gh pr edit "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/pr-body.md"

      # `pnpm run build` above zipped preview/dist into packages-zip/; attach it to
      # the GitHub release that changesets/action just created for @tabler/core.
      - name: Attach the preview zip to the GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./core/package.json').version")
          gh release upload "@tabler/core@${version}" "packages-zip/tabler-${version}.zip" --clobber

      # The integrity hashes in shared/data/sri.json can only be read from the files the CDN
      # serves, so they are refreshed once the new version is published. The `dev` ruleset does not
      # let this job push there, so the refreshed file comes back as a small pull request.
      - name: Refresh the SRI hashes
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release notes step above may have left the checkout detached on the version branch.
          git checkout --force "${GITHUB_SHA}"

          version=$(node -p "require('./core/package.json').version")
          pnpm run generate-sri --wait

          if git diff --quiet -- shared/data/sri.json; then
            echo "The SRI hashes already match @tabler/core@${version}."
            exit 0
          fi

          branch="chore/sri-${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git commit -m "chore: update SRI hashes for v${version}" -- shared/data/sri.json
          git push --force origin "${branch}"

          gh pr create \
            --base dev \
            --head "${branch}" \
            --title "chore: update SRI hashes for v${version}" \
            --body "The CDN snippets in the docs carry the \`integrity\` hash of each published file. \`@tabler/core@${version}\` is on npm now, so these are its hashes, read from the CDN by \`pnpm run generate-sri\`. Until this is merged, the SRI check fails on every pull request." \
            || gh pr edit "${branch}" --title "chore: update SRI hashes for v${version}"

      # `changesets/action` names the release `@tabler/core@1.5.0` and fills it with
      # the raw changelog entry. Rename it to `Tabler v1.5.0` and replace the body with
      # the intro from `.github/release-notes/<version>.md` followed by the changes
      # grouped per package.
      - name: Write the release notes
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./core/package.json').version")
          pnpm run release-notes "${RUNNER_TEMP}/release-body.md"
          gh release edit "@tabler/core@${version}" --title "Tabler v${version}" --notes-file "${RUNNER_TEMP}/release-body.md"
