name: Compress Images

on:
  pull_request:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    # Only run on Pull Requests within the same repository, and not from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compress Images
        # pinned to a commit: this job holds a write token
        uses: calibreapp/image-actions@83b129706d9c6e49e6013dc3617c78cbbc3de5a5 # main, 2026-09-02
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # docs images go through astro:assets, which makes the webp files at build
          # time; lossy PNG compression here only degrades the source.
          # The README preview screenshots stay lossless: the palette quantization
          # left visible shapes on the light cards (see #3186)
          ignorePaths: 'node_modules/**,docs/images/**,shared/static/tabler-preview*.png'
