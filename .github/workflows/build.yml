name: Build

on:
  pull_request: null
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # turbo directly: `pnpm run build` also zips the package, which only the release needs
      - name: Build
        run: pnpm exec turbo build
