name: Build

on:
  pull_request: null

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with: 
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: node --version

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Check rendered html
        run: pnpm run check-html preview/dist docs/dist --quiet

      - name: Check markup classes
        run: pnpm run check-markup-classes --html preview/dist --html docs/dist --css preview/dist/dist/css --css preview/dist/dist/libs --css preview/dist/preview/css --css docs/dist/css --css docs/dist/preview/css
