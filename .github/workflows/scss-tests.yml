name: SCSS Tests

on:
  pull_request: null
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Run SCSS tests
        run: pnpm --filter @tabler/core test:scss
