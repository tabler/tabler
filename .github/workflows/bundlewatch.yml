name: Bundlewatch

on:
  pull_request:
    paths-ignore:
      - '.changeset/**'
      - '.github/release-notes/**'
      - '.github/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '*.md'
      - 'LICENSE'
  push:
    branches:
      - main
      - dev
      - next

permissions:
  contents: read

env:
  FORCE_COLOR: 2

jobs:
  bundlewatch:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Run bundlewatch
        run: pnpm run bundlewatch
        env:
          BUNDLEWATCH_GITHUB_TOKEN: "${{ secrets.BUNDLEWATCH_GITHUB_TOKEN }}"
          # Compare a pull request with its base branch (`dev` or `next`);
          # a push records the branch itself as the new baseline.
          CI_BRANCH_BASE: ${{ github.base_ref || github.ref_name }}
