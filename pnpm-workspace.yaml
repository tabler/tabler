packages:
  - core
  - preview
  - docs
  - screenshots
  - shared

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  esbuild: false
  plyr: false
  sharp: false

minimumReleaseAge: 1440

# Our own packages are safe to take on release day.
minimumReleaseAgeExclude:
  - '@tabler/*'

# Optional peers (like `next` behind `@vercel/analytics`) must not be installed just because they exist.
autoInstallPeers: false

# Patched versions the upstream ranges do not reach yet; all are build/CI-time tools.
overrides:
  'axios@<0.34.0': '^0.34.0'
  'brace-expansion@<1.1.21': '^1.1.21'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  'colord@<2.9.4': '^2.9.4'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
  'follow-redirects@<1.16.1': '^1.16.1'
  'katex@<0.19.0': '^0.19.0'
  'launch-editor@<2.14.2': '^2.14.2'
  'path-to-regexp@6.1.0': '6.3.0'
  'postcss-selector-parser@<6.1.5': '^6.1.5'
  'postcss-selector-parser@>=7.0.0 <7.1.6': '^7.1.6'
  'shell-quote@<1.11.0': '^1.11.0'
  'smol-toml@<1.8.1': '^1.8.1'
  'source-map-js@<1.2.2': '^1.2.2'
  'svgo@<4.1.0': '^4.1.0'
  'undici@>=8.0.0 <8.12.2': '^8.12.2'
  'zod@<4.6.6': '^4.6.6'
